org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Lets the background sync run as a dataSync foreground service, which is what
# the five-minute and push modes are. Without it the workmanager plugin ships a
# manifest declaring that service as shortService only, the app asks Android to
# start it as dataSync, and Android answers by killing the process:
#
#   IllegalArgumentException: foregroundServiceType 0x00000001 is not a subset
#   of foregroundServiceType attribute 0x00000800 in service element
#
# That is a crash at every launch, not a failed sync, because the service is
# started from the app's own process. It only appears once someone has actually
# chosen one of those two sync modes, which is why it survived every test here.
#
# The flag is opt-in because dataSync is a Play Console special type needing a
# declaration form and a video. MyEmail is installed from a file, not Play, so
# that does not apply.
workmanager.enableDataSyncForegroundService=true
